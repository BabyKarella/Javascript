<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
       function  addition(){
         var num1=parseInt(document.getElementById("t1").value);
        var num2=parseInt(document.getElementById("t2").value);
        var sum=num1+num2
        var sum=document.getElementById("t3").value=sum;
       }
       function  subtraction(){
         var num1=parseInt(document.getElementById("t1").value);
        var num2=parseInt(document.getElementById("t2").value);
        var sum=num1-num2
        var sum=document.getElementById("t3").value=sum;
       }
        function  multiplication(){
         var num1=parseInt(document.getElementById("t1").value);
        var num2=parseInt(document.getElementById("t2").value);
        var sum=num1*num2
        var sum=document.getElementById("t3").value=sum;
       }
        function  division(){
         var num1=parseInt(document.getElementById("t1").value);
        var num2=parseInt(document.getElementById("t2").value);
        var sum=num1/num2
        var sum=document.getElementById("t3").value=sum;
       }
        function  modulus(){
         var num1=parseInt(document.getElementById("t1").value);
        var num2=parseInt(document.getElementById("t2").value);
        var sum=num1%num2
        var sum=document.getElementById("t3").value=sum;
       }
       function  expo(){
         var num1=parseInt(document.getElementById("t1").value);
        var num2=parseInt(document.getElementById("t2").value);
        var sum=num1**num2
        var sum=document.getElementById("t3").value=sum;
       }
    </script>
    <style>
        .parent{
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 200px;
        }
        .container{
            width: 50%;
            background-image:linear-gradient(90deg,rgb(121, 121, 153),rgb(61, 65, 157)) ;
            border: 2px solid black;
            text-align: center;
            height: 350px;
        }
        button{
            margin-top: 30px ;
            width: 100px;
            border-radius: 10px;
            text-align: center;

        }
        button:hover{
            background:rgb(213, 108, 126);
        }
        h1{
            color:white;
        }
    </style>
</head>
<body>
    <div class="parent"> 
    <div class="container">
        <h1 id="head">Multi task page</h1>
        <label for="">ENTER N1:</label>
    <input type="text" id="t1">
    <br><br>
    <label for="">ENTER N2:</label>
    <input type="text" id="t2">
    <br><br>
    <label for="">RESULT:</label>
    <input type="text" id="t3">
    <br>
    <br>
    <button onclick="addition()">ADD</button>
    <button onclick="subtraction()">SUB</button>
    <button onclick="multiplication()">MULTI</button>
    <button onclick="division()">DIVISION</button>
    <button onclick="modulus()">MODULUS</button>
    <button onclick="expo()">EXPO</button>
    </div>
    </div>
</body>
</html>
